<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="932" viewBox="0 0 1200 932" role="img" aria-label="About: Abdelrahman Yasser Fathy, Software Engineer specialising in React Native mobile engineering, based in Egypt and open to relocation, 3+ years professional. What I bring: Ships production-ready mobile apps at scale; Writes clean, typed, testable code; Bridges AI tooling into real engineering workflows; Collaborates across design, product &amp; backend teams. Growing in: Enterprise architecture; Native modules &amp; the bridge; Performance optimisation; AI agents &amp; workflows.">
  <defs>
    <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .display { font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; }
