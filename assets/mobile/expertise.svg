    <text x="66" y="772.0" class="mono" font-size="16" letter-spacing="2.4" fill="#e9e9ec">(06)</text>
    <text x="64" y="808.0" class="display" font-size="32" letter-spacing="-1" fill="#f2f2f3">CI/CD</text>
