    <text x="64" y="572.0" class="display" font-size="32" letter-spacing="-1" fill="#f2f2f3">API integration</text>
    <text x="66" y="600.0" class="mono" font-size="17" letter-spacing="0.8" fill="#8f8f96">GraphQL · REST · Firebase</text>
