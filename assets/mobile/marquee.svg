<svg xmlns="http://www.w3.org/2000/svg" width="600" height="72" viewBox="0 0 600 72" role="img" aria-label="Software Engineer · React Native Specialist · AI-Driven Builder · Always Learning · Always Shipping">
  <defs>
    <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .display { font-family: 'Syne', 'Archivo Black', 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .serif { font-family: 'Instrument Serif', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; }
    .sans { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rise { animation: rise 1s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s cubic-bezier(0.16,1,0.3,1) infinite; }
    @keyframes pulse { 0% { opacity: .6; transform: scale(1) } 80%, 100% { opacity: 0; transform: scale(2.6) } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .track { animation: marquee 30s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .rise, .blink, .pulse, .spin, .track { animation: none } }
    </style>
    <radialGradient id="gv" cx="1" cy="0" r="0.75"><stop offset="0" stop-color="#c8ff2e" stop-opacity="0.13"/><stop offset="1" stop-color="#c8ff2e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gi" cx="0" cy="1" r="0.7"><stop offset="0" stop-color="#3df5ff" stop-opacity="0.09"/><stop offset="1" stop-color="#3df5ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
    <linearGradient id="signal" x1="0" x2="1"><stop offset="0" stop-color="#c8ff2e"/><stop offset="1" stop-color="#3df5ff"/></linearGradient>
    <clipPath id="frame"><rect width="600" height="72" rx="20"/></clipPath>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#06070a"/><stop offset="0.08" stop-color="#06070a" stop-opacity="0"/><stop offset="0.92" stop-color="#06070a" stop-opacity="0"/><stop offset="1" stop-color="#06070a"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="72" fill="#06070a"/>
    
    <rect width="600" height="72" fill="url(#gv)"/>
    <rect width="600" height="72" fill="url(#gi)"/>
    <style>.track { animation-name: mq } @keyframes mq { to { transform: translateX(-2080px) } }</style><g class="track">
    <text x="0" y="48" class="display" font-size="32" letter-spacing="-1" fill="#eef0f4" textLength="2080" lengthAdjust="spacing">SOFTWARE ENGINEER<tspan fill="#c8ff2e" font-size="21">   ✦   </tspan>REACT NATIVE SPECIALIST<tspan fill="#c8ff2e" font-size="21">   ✦   </tspan>AI-DRIVEN BUILDER<tspan fill="#c8ff2e" font-size="21">   ✦   </tspan>ALWAYS LEARNING<tspan fill="#c8ff2e" font-size="21">   ✦   </tspan>ALWAYS SHIPPING<tspan fill="#c8ff2e" font-size="21">   ✦   </tspan></text>
    <text x="2080" y="48" class="display" font-size="32" letter-spacing="-1" fill="#eef0f4" textLength="2080" lengthAdjust="spacing">SOFTWARE ENGINEER<tspan fill="#c8ff2e" font-size="21">   ✦   </tspan>REACT NATIVE SPECIALIST<tspan fill="#c8ff2e" font-size="21">   ✦   </tspan>AI-DRIVEN BUILDER<tspan fill="#c8ff2e" font-size="21">   ✦   </tspan>ALWAYS LEARNING<tspan fill="#c8ff2e" font-size="21">   ✦   </tspan>ALWAYS SHIPPING<tspan fill="#c8ff2e" font-size="21">   ✦   </tspan></text>
  </g>
  <rect width="600" height="72" fill="url(#fade)"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="71" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
