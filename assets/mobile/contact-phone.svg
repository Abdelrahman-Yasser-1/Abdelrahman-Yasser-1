<svg xmlns="http://www.w3.org/2000/svg" width="600" height="124" viewBox="0 0 600 124" role="img" aria-label="Phone: +20 101 934 7297">
  <defs>
    <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .display { font-family: 'Syne', 'Archivo Black', 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .serif { font-family: 'Instrument Serif', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; }
    .sans { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rise { animation: rise 1s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s cubic-bezier(0.16,1,0.3,1) infinite; }
    @keyframes pulse { 0% { opacity: .6; transform: scale(1) } 80%, 100% { opacity: 0; transform: scale(2.6) } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .track { animation: marquee 30s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .rise, .blink, .pulse, .spin, .track { animation: none } }
    </style>
    <radialGradient id="gv" cx="1" cy="0.5" r="0.75"><stop offset="0" stop-color="#c8ff2e" stop-opacity="0.13"/><stop offset="1" stop-color="#c8ff2e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gi" cx="0" cy="0.5" r="0.7"><stop offset="0" stop-color="#3df5ff" stop-opacity="0.09"/><stop offset="1" stop-color="#3df5ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
    <linearGradient id="signal" x1="0" x2="1"><stop offset="0" stop-color="#c8ff2e"/><stop offset="1" stop-color="#3df5ff"/></linearGradient>
    <clipPath id="frame"><rect width="600" height="124" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="124" fill="#11141b"/>
    
    <rect width="600" height="124" fill="url(#gv)"/>
    <rect width="600" height="124" fill="url(#gi)"/>
    <text x="32" y="48" class="mono" font-size="16" letter-spacing="2.4" fill="#c8ff2e">(02)</text><text x="92" y="48" class="mono" font-size="16" letter-spacing="2.4" fill="#8a90a0">PHONE</text>
    <text x="32" y="94" class="sans" font-size="23" letter-spacing="0" fill="#eef0f4">+20 101 934 7297</text>
    <text x="568" y="50" class="sans" font-size="26" letter-spacing="0" fill="#5b6170" text-anchor="end">·</text>
  </g>
  <rect x="0.5" y="0.5" width="599" height="123" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
