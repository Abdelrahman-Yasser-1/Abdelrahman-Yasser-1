<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1055" viewBox="0 0 600 1055" role="img" aria-label="Tech arsenal: Mobile &amp; UI: React Native, Expo, React Navigation, React, Tailwind CSS, Bootstrap, HTML, CSS, Figma; Languages: TypeScript, JavaScript, Java, Python, C, C++, C#, R; State &amp; data: Redux, Zustand, TanStack Query, React Hook Form, Zod, GraphQL, Firebase, SQLite, Postman; Testing: Jest, Selenium, Storybook; Delivery: Git, GitHub, Docker, Azure, Fastlane, Gradle, npm, Yarn, Vercel, Netlify">
  <defs>
