<svg xmlns="http://www.w3.org/2000/svg" width="600" height="402" viewBox="0 0 600 402" role="img" aria-label="Contact — Let&#x27;s build together. Open to full-time and freelance roles. Reach out on any channel below. Available for full-time and freelance; notice period 2 months; Egyptian citizen; open to relocation.">
  <defs>
    <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .display { font-family: 'Syne', 'Archivo Black', 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .serif { font-family: 'Instrument Serif', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; }
    .sans { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rise { animation: rise 1s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s cubic-bezier(0.16,1,0.3,1) infinite; }
    @keyframes pulse { 0% { opacity: .6; transform: scale(1) } 80%, 100% { opacity: 0; transform: scale(2.6) } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .track { animation: marquee 30s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .rise, .blink, .pulse, .spin, .track { animation: none } }
    </style>
    <radialGradient id="gv" cx="0" cy="0" r="0.75"><stop offset="0" stop-color="#c8ff2e" stop-opacity="0.13"/><stop offset="1" stop-color="#c8ff2e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gi" cx="1" cy="1" r="0.7"><stop offset="0" stop-color="#3df5ff" stop-opacity="0.09"/><stop offset="1" stop-color="#3df5ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
    <linearGradient id="signal" x1="0" x2="1"><stop offset="0" stop-color="#c8ff2e"/><stop offset="1" stop-color="#3df5ff"/></linearGradient>
    <clipPath id="frame"><rect width="600" height="402" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="402" fill="#0b0d12"/>
    <rect width="600" height="402" fill="url(#grid)"/>
    <rect width="600" height="402" fill="url(#gv)"/>
    <rect width="600" height="402" fill="url(#gi)"/>
    <g class="rise">
    <text x="36" y="52" class="mono" font-size="17" letter-spacing="3" fill="#c8ff2e">(05)</text>
    <line x1="94" y1="45.9" x2="126" y2="45.9" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="138" y="52" class="mono" font-size="17" letter-spacing="3" fill="#8a90a0">CONTACT</text>
  </g>
  <g class="rise" style="animation-delay:.12s">
    <text x="34" y="106" class="display" font-size="40" letter-spacing="-2" fill="#eef0f4">LET&#x27;S BUILD<tspan class="serif" font-size="44" letter-spacing="0" fill="#c8ff2e"> together</tspan></text>
  </g>
  <text x="36" y="144" class="sans" font-size="22" letter-spacing="0" fill="#8a90a0">Open to full-time and freelance roles. Reach</text>
  <text x="36" y="182" class="sans" font-size="22" letter-spacing="0" fill="#8a90a0">out on any channel below.</text>
  <g class="rise" style="animation-delay:0.20s"><rect x="36" y="216" width="404" height="42" rx="21.0" fill="#11141b" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/><circle class="pulse" cx="56.8" cy="237.0" r="5.8" fill="#c8ff2e"/><circle cx="56.8" cy="237.0" r="5.8" fill="#c8ff2e"/><text x="74" y="243" class="mono" font-size="16" letter-spacing="1.0" fill="#eef0f4">AVAILABLE · FULL-TIME &amp; FREELANCE</text></g>
  <g class="rise" style="animation-delay:0.27s"><rect x="36" y="270" width="290" height="42" rx="21.0" fill="#11141b" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/><text x="54" y="297" class="mono" font-size="16" letter-spacing="1.0" fill="#8a90a0">NOTICE PERIOD · 2 MONTHS</text></g>
  <g class="rise" style="animation-delay:0.34s"><rect x="36" y="324" width="268" height="42" rx="21.0" fill="#11141b" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/><text x="54" y="351" class="mono" font-size="16" letter-spacing="1.0" fill="#8a90a0">CITIZENSHIP · EGYPTIAN</text></g>
  <g class="rise" style="animation-delay:0.41s"><rect x="316" y="324" width="226" height="42" rx="21.0" fill="#11141b" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/><text x="334" y="351" class="mono" font-size="16" letter-spacing="1.0" fill="#8a90a0">OPEN TO RELOCATION</text></g>
  </g>
  <rect x="0.5" y="0.5" width="599" height="401" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
