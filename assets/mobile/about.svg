<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1420" viewBox="0 0 600 1420" role="img" aria-label="About: Abdelrahman Yasser Fathy, Software Engineer specialising in React Native mobile engineering, based in Egypt and open to relocation, 3+ years professional. What I bring: Ships production-ready mobile apps at scale; Writes clean, typed, testable code; Bridges AI tooling into real engineering workflows; Collaborates across design, product &amp; backend teams. Growing in: Enterprise architecture; Native modules &amp; the bridge; Performance optimization; AI agents &amp; workflows.">
  <defs>
    <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .display { font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; }
    .serif { font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; }
    .sans { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rise { animation: rise 1s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s cubic-bezier(0.16,1,0.3,1) infinite; }
    @keyframes pulse { 0% { opacity: .6; transform: scale(1) } 80%, 100% { opacity: 0; transform: scale(2.6) } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .track { animation: marquee 30s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .rise, .blink, .pulse, .spin, .track { animation: none } }
    </style>
    <radialGradient id="gv" cx="1" cy="0" r="0.75"><stop offset="0" stop-color="#ffffff" stop-opacity="0.052"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.000"/></radialGradient>
    <radialGradient id="gi" cx="0" cy="1" r="0.7"><stop offset="0" stop-color="#ffffff" stop-opacity="0.027"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.000"/></radialGradient>
