  <g class="rise" style="animation-delay:.5s"><text x="40" y="914.0" class="mono" font-size="16" letter-spacing="2.6" fill="#e9e9ec">WHAT I BRING</text><text x="40" y="968.0" class="mono" font-size="22" letter-spacing="0" fill="#e9e9ec">→</text><text x="72" y="968.0" class="sans" font-size="22" letter-spacing="0" fill="#f2f2f3">Ships production-ready mobile apps at scale</text><text x="40" y="1008.0" class="mono" font-size="22" letter-spacing="0" fill="#e9e9ec">→</text><text x="72" y="1008.0" class="sans" font-size="22" letter-spacing="0" fill="#f2f2f3">Writes clean, typed, testable code</text><text x="40" y="1048.0" class="mono" font-size="22" letter-spacing="0" fill="#e9e9ec">→</text><text x="72" y="1048.0" class="sans" font-size="22" letter-spacing="0" fill="#f2f2f3">Bridges AI tooling into real engineering</text><text x="72" y="1078.0" class="sans" font-size="22" letter-spacing="0" fill="#f2f2f3">workflows</text><text x="40" y="1118.0" class="mono" font-size="22" letter-spacing="0" fill="#e9e9ec">→</text><text x="72" y="1118.0" class="sans" font-size="22" letter-spacing="0" fill="#f2f2f3">Collaborates across design, product &amp; backend</text><text x="72" y="1148.0" class="sans" font-size="22" letter-spacing="0" fill="#f2f2f3">teams</text></g>
  <g class="rise" style="animation-delay:.6s"><text x="40" y="1210.0" class="mono" font-size="16" letter-spacing="2.6" fill="#e9e9ec">GROWING IN</text><text x="40" y="1264.0" class="mono" font-size="22" letter-spacing="0" fill="#e9e9ec">→</text><text x="72" y="1264.0" class="sans" font-size="22" letter-spacing="0" fill="#f2f2f3">Enterprise architecture</text><text x="40" y="1304.0" class="mono" font-size="22" letter-spacing="0" fill="#e9e9ec">→</text><text x="72" y="1304.0" class="sans" font-size="22" letter-spacing="0" fill="#f2f2f3">Native modules &amp; the bridge</text><text x="40" y="1344.0" class="mono" font-size="22" letter-spacing="0" fill="#e9e9ec">→</text><text x="72" y="1344.0" class="sans" font-size="22" letter-spacing="0" fill="#f2f2f3">Performance optimization</text><text x="40" y="1384.0" class="mono" font-size="22" letter-spacing="0" fill="#e9e9ec">→</text><text x="72" y="1384.0" class="sans" font-size="22" letter-spacing="0" fill="#f2f2f3">AI agents &amp; workflows</text></g>
