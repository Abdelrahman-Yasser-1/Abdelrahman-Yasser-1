      .serif { font-family: 'Instrument Serif', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; }
      .sans { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .glow { animation: breathe 6s ease-in-out infinite; }
      @keyframes breathe { 50% { opacity: .55 } }
      @media (prefers-reduced-motion: reduce) { .glow { animation: none } }
