    <radialGradient id="g" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#3d7bff" stop-opacity="0.32"/><stop offset="1" stop-color="#3d7bff" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="580" height="290" rx="18"/></clipPath>
