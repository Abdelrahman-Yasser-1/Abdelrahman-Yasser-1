<g class="rise" style="animation-delay:0.40s"><text x="832" y="184" class="mono" font-size="12" letter-spacing="2.4" fill="#c8ff2e">(06)</text><text x="830" y="228" class="display" font-size="30" letter-spacing="-1" fill="#eef0f4">CI / CD</text><text x="832" y="256" class="mono" font-size="13" letter-spacing="1" fill="#8a90a0">Fastlane · GitHub Actions</text></g>
