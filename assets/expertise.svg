<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="506" viewBox="0 0 1200 506" role="img" aria-label="Core expertise: React Native — Production apps; TypeScript — Type-safe at scale; State mgmt — Redux · Zustand · Context; API integration — GraphQL · REST · Firebase; Testing — Jest · Detox · RTL; CI / CD — Fastlane · GitHub Actions">
  <defs>
    <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .display { font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; }
    .serif { font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; }
    .sans { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rise { animation: rise 1s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s cubic-bezier(0.16,1,0.3,1) infinite; }
    @keyframes pulse { 0% { opacity: .6; transform: scale(1) } 80%, 100% { opacity: 0; transform: scale(2.6) } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .track { animation: marquee 30s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .rise, .blink, .pulse, .spin, .track { animation: none } }
    </style>
    <radialGradient id="gv" cx="0" cy="0" r="0.75"><stop offset="0" stop-color="#ffffff" stop-opacity="0.052"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.000"/></radialGradient>
    <radialGradient id="gi" cx="1" cy="1" r="0.7"><stop offset="0" stop-color="#ffffff" stop-opacity="0.027"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.000"/></radialGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="506" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
