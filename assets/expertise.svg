<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Core expertise: React Native production apps; type-safe TypeScript; state management with Redux, Zustand and Context; GraphQL, REST and Firebase APIs; testing with Jest, Detox and RTL; CI/CD with Fastlane and GitHub Actions">
  <defs><style>
      .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .display { font-family: 'Syne', 'Archivo Black', 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .serif { font-family: 'Instrument Serif', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; }
      .sans { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .rise { animation: rise 1s cubic-bezier(0.16,1,0.3,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .rise, .blink { animation: none } }
  </style></defs>
  <rect width="1200" height="280" rx="18" fill="#0b0d12"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="400.5" y1="20" x2="400.5" y2="260" stroke="#ffffff" stroke-opacity="0.08"/><line x1="800.5" y1="20" x2="800.5" y2="260" stroke="#ffffff" stroke-opacity="0.08"/><line x1="24" y1="140.5" x2="1176" y2="140.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <g class="rise" style="animation-delay:0.00s"><text x="32" y="44" class="mono" font-size="12" letter-spacing="2.4" fill="#c8ff2e">(01)</text><text x="30" y="88" class="display" font-size="30" letter-spacing="-1" fill="#eef0f4">REACT NATIVE</text><text x="32" y="116" class="mono" font-size="13" letter-spacing="1" fill="#8a90a0">Production apps</text></g>
<g class="rise" style="animation-delay:0.08s"><text x="432" y="44" class="mono" font-size="12" letter-spacing="2.4" fill="#c8ff2e">(02)</text><text x="430" y="88" class="display" font-size="30" letter-spacing="-1" fill="#eef0f4">TYPESCRIPT</text><text x="432" y="116" class="mono" font-size="13" letter-spacing="1" fill="#8a90a0">Type-safe at scale</text></g>
<g class="rise" style="animation-delay:0.16s"><text x="832" y="44" class="mono" font-size="12" letter-spacing="2.4" fill="#c8ff2e">(03)</text><text x="830" y="88" class="display" font-size="30" letter-spacing="-1" fill="#eef0f4">STATE MGMT</text><text x="832" y="116" class="mono" font-size="13" letter-spacing="1" fill="#8a90a0">Redux · Zustand · Context</text></g>
<g class="rise" style="animation-delay:0.24s"><text x="32" y="184" class="mono" font-size="12" letter-spacing="2.4" fill="#c8ff2e">(04)</text><text x="30" y="228" class="display" font-size="30" letter-spacing="-1" fill="#eef0f4">API INTEGRATION</text><text x="32" y="256" class="mono" font-size="13" letter-spacing="1" fill="#8a90a0">GraphQL · REST · Firebase</text></g>
