<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="506" viewBox="0 0 1200 506" role="img" aria-label="Core expertise: React Native — Production apps; TypeScript — Type-safe at scale; State mgmt — Redux · Zustand · Context; API integration — GraphQL · REST · Firebase; Testing — Jest · Detox · RTL; CI / CD — Fastlane · GitHub Actions">
  <defs>
    <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .display { font-family: 'Syne', 'Archivo Black', 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .serif { font-family: 'Instrument Serif', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; }
    .sans { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rise { animation: rise 1s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s cubic-bezier(0.16,1,0.3,1) infinite; }
    @keyframes pulse { 0% { opacity: .6; transform: scale(1) } 80%, 100% { opacity: 0; transform: scale(2.6) } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .track { animation: marquee 30s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .rise, .blink, .pulse, .spin, .track { animation: none } }
    </style>
    <radialGradient id="gv" cx="0" cy="0" r="0.75"><stop offset="0" stop-color="#c8ff2e" stop-opacity="0.13"/><stop offset="1" stop-color="#c8ff2e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gi" cx="1" cy="1" r="0.7"><stop offset="0" stop-color="#3df5ff" stop-opacity="0.09"/><stop offset="1" stop-color="#3df5ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
    <linearGradient id="signal" x1="0" x2="1"><stop offset="0" stop-color="#c8ff2e"/><stop offset="1" stop-color="#3df5ff"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="506" rx="20"/></clipPath>
  </defs>
