<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Abdelrahman Yasser — Mobile &amp; software engineer building apps, SDKs and the systems behind them. Open to full-time &amp; freelance.">
  <defs>
    <radialGradient id="light" cx="0.45" cy="0" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.08"/></pattern>
    <linearGradient id="dotFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotMask"><rect width="1200" height="390" fill="url(#dotFade)"/></mask>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#8d8d94"/><stop offset="0.22" stop-color="#ffffff"/><stop offset="0.4" stop-color="#b9b9c0"/>
      <stop offset="0.55" stop-color="#ffffff"/><stop offset="0.78" stop-color="#c9c9cf"/><stop offset="1" stop-color="#f6f6f8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.42" stop-color="#7b7b82"/><stop offset="0.58" stop-color="#f4f4f6"/><stop offset="1" stop-color="#3b3b40"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <path id="star" d="M0 -48 C2 -14 14 -2 48 0 C14 2 2 14 0 48 C-2 14 -14 2 -48 0 C-14 -2 -2 -14 0 -48Z"/>
    <clipPath id="frame"><rect width="1200" height="390" rx="20"/></clipPath>
    <style>
      .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .sans { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .display { font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; }
      .light { font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 300; }
      .rise { animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .float { animation: float 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes float { 50% { transform: translateY(-8px) rotate(-4deg) } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s cubic-bezier(0.16,1,0.3,1) infinite; }
      @keyframes pulse { 0% { opacity: .6; transform: scale(1) } 80%,100% { opacity: 0; transform: scale(2.6) } }
      @media (prefers-reduced-motion: reduce) { .rise, .float, .pulse { animation: none } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="390" fill="#070708"/>
    <rect width="1200" height="390" fill="url(#dots)" mask="url(#dotMask)"/>
    <rect width="1200" height="390" fill="url(#light)"/>
    <g transform="translate(1060 118) scale(1.15)"><use href="#star" class="float" style="animation-delay:0s" fill="#ffffff" fill-opacity="0.06" stroke="url(#edge)" stroke-width="2.26"/></g>
    <g transform="translate(1148 262) scale(0.45)"><use href="#star" class="float" style="animation-delay:-2.5s" fill="#ffffff" fill-opacity="0.06" stroke="url(#edge)" stroke-width="5.78"/></g>
    <g transform="translate(968 318) scale(0.32)"><use href="#star" class="float" style="animation-delay:-4.5s" fill="#ffffff" fill-opacity="0.06" stroke="url(#edge)" stroke-width="8.12"/></g>
    <g class="rise"><rect x="56" y="44" width="283" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/><circle class="pulse" cx="76" cy="60.8" r="4" fill="#e9e9ec"/><circle cx="76" cy="60.8" r="4" fill="#e9e9ec"/><text x="90" y="65.8" class="sans" font-size="14" fill="#f2f2f3">Open to full-time &amp; freelance</text></g>
    <g class="rise" style="animation-delay:.1s"><text x="56" y="140" class="light" font-size="28" fill="#8f8f96">Hi, I'm</text></g>
    <g class="rise" style="animation-delay:.2s"><text x="52" y="230" class="display" font-size="92" letter-spacing="-3" fill="url(#chrome)">Abdelrahman Yasser</text></g>
    <g class="rise" style="animation-delay:.35s"><text x="56" y="282" class="sans" font-size="20" fill="#d6d6da">Mobile &amp; software engineer — building apps, SDKs and the systems behind them.</text></g>
    <g class="rise" style="animation-delay:.5s"><rect x="56" y="312" width="48" height="29" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.1"/><text x="80" y="331.0" text-anchor="middle" class="sans" font-size="13" fill="#d6d6da">iOS</text><rect x="112" y="312" width="77" height="29" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.1"/><text x="150" y="331.0" text-anchor="middle" class="sans" font-size="13" fill="#d6d6da">Android</text><rect x="197" y="312" width="113" height="29" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.1"/><text x="253" y="331.0" text-anchor="middle" class="sans" font-size="13" fill="#d6d6da">React Native</text><rect x="318" y="312" width="55" height="29" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.1"/><text x="346" y="331.0" text-anchor="middle" class="sans" font-size="13" fill="#d6d6da">SDKs</text><rect x="381" y="312" width="99" height="29" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.1"/><text x="431" y="331.0" text-anchor="middle" class="sans" font-size="13" fill="#d6d6da">TypeScript</text></g>
    <rect x="0" y="388" width="1200" height="2" fill="url(#line)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="389" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
