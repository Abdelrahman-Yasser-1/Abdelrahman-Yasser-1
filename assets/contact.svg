<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="316" viewBox="0 0 1200 316" role="img" aria-label="Contact — Let&#x27;s build together. Open to full-time and freelance roles. Reach out on any channel below. Available for full-time and freelance; notice period 2 months; Egyptian citizen; open to relocation.">
  <defs>
    <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .display { font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; }
    .serif { font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; }
    .sans { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rise { animation: rise 1s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s cubic-bezier(0.16,1,0.3,1) infinite; }
    @keyframes pulse { 0% { opacity: .6; transform: scale(1) } 80%, 100% { opacity: 0; transform: scale(2.6) } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .track { animation: marquee 30s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .rise, .blink, .pulse, .spin, .track { animation: none } }
    </style>
    <radialGradient id="gv" cx="0" cy="0" r="0.75"><stop offset="0" stop-color="#ffffff" stop-opacity="0.052"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.000"/></radialGradient>
    <radialGradient id="gi" cx="1" cy="1" r="0.7"><stop offset="0" stop-color="#ffffff" stop-opacity="0.027"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.000"/></radialGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="316" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="316" fill="#0c0c0e"/>
    <rect width="1200" height="316" fill="url(#grid)"/>
    <rect width="1200" height="316" fill="url(#gv)"/>
    <rect width="1200" height="316" fill="url(#gi)"/>
    <g class="rise">
    <text x="56" y="72" class="mono" font-size="13" letter-spacing="3.2" fill="#e9e9ec">(05)</text>
    <line x1="100" y1="67.3" x2="132" y2="67.3" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="144" y="72" class="mono" font-size="13" letter-spacing="3.2" fill="#8f8f96">CONTACT</text>
  </g>
  <g class="rise" style="animation-delay:.12s">
    <text x="54" y="148" class="display" font-size="56" letter-spacing="-2" fill="#f2f2f3">Let&#x27;s build<tspan class="serif" font-size="60" letter-spacing="0" fill="#8f8f96"> together</tspan></text>
  </g>
  <text x="56" y="190" class="sans" font-size="19" letter-spacing="0" fill="#8f8f96">Open to full-time and freelance roles. Reach out on any channel below.</text>
  <g class="rise" style="animation-delay:0.20s"><rect x="56" y="226" width="335" height="34" rx="17.0" fill="#121214" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/><circle class="pulse" cx="72.9" cy="243.0" r="4.7" fill="#e9e9ec"/><circle cx="72.9" cy="243.0" r="4.7" fill="#e9e9ec"/><text x="87" y="248" class="mono" font-size="13" letter-spacing="1.0" fill="#f2f2f3">AVAILABLE · FULL-TIME &amp; FREELANCE</text></g>
  <g class="rise" style="animation-delay:0.27s"><rect x="403" y="226" width="240" height="34" rx="17.0" fill="#121214" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/><text x="417" y="248" class="mono" font-size="13" letter-spacing="1.0" fill="#8f8f96">NOTICE PERIOD · 2 MONTHS</text></g>
  <g class="rise" style="animation-delay:0.34s"><rect x="655" y="226" width="222" height="34" rx="17.0" fill="#121214" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/><text x="669" y="248" class="mono" font-size="13" letter-spacing="1.0" fill="#8f8f96">CITIZENSHIP · EGYPTIAN</text></g>
  <g class="rise" style="animation-delay:0.41s"><rect x="889" y="226" width="187" height="34" rx="17.0" fill="#121214" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/><text x="903" y="248" class="mono" font-size="13" letter-spacing="1.0" fill="#8f8f96">OPEN TO RELOCATION</text></g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="315" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
