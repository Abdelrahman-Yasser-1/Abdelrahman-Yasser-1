<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="234" viewBox="0 0 1200 234" role="img" aria-label="GitHub activity — commits, streaks and languages, updated live">
  <defs>
    <style>
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .display { font-family: 'Syne', 'Archivo Black', 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .serif { font-family: 'Instrument Serif', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; }
    .sans { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rise { animation: rise 1s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s cubic-bezier(0.16,1,0.3,1) infinite; }
    @keyframes pulse { 0% { opacity: .6; transform: scale(1) } 80%, 100% { opacity: 0; transform: scale(2.6) } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .track { animation: marquee 30s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .rise, .blink, .pulse, .spin, .track { animation: none } }
    </style>
    <radialGradient id="gv" cx="0.5" cy="1.2" r="0.75"><stop offset="0" stop-color="#c8ff2e" stop-opacity="0.13"/><stop offset="1" stop-color="#c8ff2e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gi" cx="0" cy="1" r="0.7"><stop offset="0" stop-color="#3df5ff" stop-opacity="0.09"/><stop offset="1" stop-color="#3df5ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
    <linearGradient id="signal" x1="0" x2="1"><stop offset="0" stop-color="#c8ff2e"/><stop offset="1" stop-color="#3df5ff"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="234" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="234" fill="#0b0d12"/>
    <rect width="1200" height="234" fill="url(#grid)"/>
    <rect width="1200" height="234" fill="url(#gv)"/>
    <rect width="1200" height="234" fill="url(#gi)"/>
    <g class="rise">
    <text x="56" y="72" class="mono" font-size="13" letter-spacing="3.2" fill="#c8ff2e">(04)</text>
    <line x1="100" y1="67.3" x2="132" y2="67.3" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="144" y="72" class="mono" font-size="13" letter-spacing="3.2" fill="#8a90a0">SIGNAL</text>
  </g>
  <g class="rise" style="animation-delay:.12s">
    <text x="54" y="148" class="display" font-size="56" letter-spacing="-2" fill="#eef0f4">GITHUB<tspan class="serif" font-size="60" letter-spacing="0" fill="#c8ff2e"> activity</tspan></text>
  </g>
  <text x="56" y="186" class="mono" font-size="14" letter-spacing="0.6" fill="#8a90a0">Commits, streaks &amp; languages — updated live</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="233" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
